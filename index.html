<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INSTASHIV</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f6f6f8;color:#20202a;font-family:Arial,sans-serif}
    header{background:#fff;border-bottom:1px solid #e8e8ed;padding:17px 22px;text-align:center;font-size:27px;font-weight:900;letter-spacing:-1px}
    header span{color:#e1306c}
    main{max-width:440px;margin:42px auto;padding:0 16px}
    .card{background:#fff;padding:26px;border:1px solid #e9e9ef;border-radius:16px;box-shadow:0 8px 30px #20202a0d}
    h2{margin:0 0 8px}
    .muted{color:#777;font-size:14px;line-height:1.5}
    input{display:block;width:100%;padding:13px 14px;margin:12px 0;border:1px solid #dedee6;border-radius:9px;font-size:15px}
    button{border:0;border-radius:9px;padding:13px 16px;background:#e1306c;color:white;font-weight:700;font-size:15px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .primary{width:100%;margin-top:8px}
    .switch{text-align:center;margin-top:18px;color:#1769d2;cursor:pointer;font-size:14px}
    #status{margin-top:15px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
    .hidden{display:none}
    .welcome{max-width:700px;margin:35px auto;padding:0 16px}
    .welcome .card{text-align:center}
    .logout{background:#333;margin-top:18px}
    .mark{font-size:42px;margin:10px}
  </style>
</head>
<body>
<header>INSTA<span>SHIV</span></header>

<main id="authArea">
  <section class="card">
    <h2 id="heading">Create your account</h2>
    <p class="muted" id="subheading">Join INSTASHIV and share your world.</p>
    <form id="authForm">
      <input id="name" type="text" placeholder="Your name" autocomplete="name">
      <input id="email" type="email" placeholder="Email address" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (at least 6 characters)" autocomplete="current-password" minlength="6" required>
      <button class="primary" id="action" type="submit">Sign Up</button>
    </form>
    <div class="switch" id="switchMode">Already have an account? Login</div>
    <div id="status" role="status"></div>
  </section>
</main>

<section id="userArea" class="welcome hidden">
  <div class="card">
    <div class="mark">🎉</div>
    <h2>Welcome to INSTASHIV!</h2>
    <p class="muted" id="userMessage">You are signed in.</p>
    <p class="muted">Your account connection is working. The next step is adding shared posts, profiles, likes and comments with secure database tables.</p>
    <button class="logout" id="logout">Log Out</button>
  </div>
</section>

<script>
  // Browser-safe Supabase project credentials. Never put a secret/service_role key here.
  const SUPABASE_URL = "https://hafaonvhwaprqngygxxd.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fBPfivzqRqvJNjTqHAsOPg_0I4lbtNN";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  let isSignUp = true;

  const authArea = document.getElementById("authArea");
  const userArea = document.getElementById("userArea");
  const nameInput = document.getElementById("name");
  const heading = document.getElementById("heading");
  const subheading = document.getElementById("subheading");
  const actionButton = document.getElementById("action");
  const switchMode = document.getElementById("switchMode");
  const statusBox = document.getElementById("status");

  function setMode(signUpMode) {
    isSignUp = signUpMode;
    heading.textContent = isSignUp ? "Create your account" : "Welcome back";
    subheading.textContent = isSignUp
      ? "Join INSTASHIV and share your world."
      : "Log in to continue to INSTASHIV.";
    actionButton.textContent = isSignUp ? "Sign Up" : "Login";
    switchMode.textContent = isSignUp
      ? "Already have an account? Login"
      : "New here? Create an account";
    nameInput.classList.toggle("hidden", !isSignUp);
    nameInput.required = isSignUp;
    statusBox.textContent = "";
  }

  switchMode.addEventListener("click", () => setMode(!isSignUp));

  document.getElementById("authForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const fullName = nameInput.value.trim();

    if (password.length < 6) {
      statusBox.textContent = "Please use a password with at least 6 characters.";
      return;
    }

    actionButton.disabled = true;
    statusBox.textContent = "Please wait…";

    try {
      let result;
      if (isSignUp) {
        result = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { full_name: fullName } }
        });
      } else {
        result = await supabaseClient.auth.signInWithPassword({ email, password });
      }

      if (result.error) throw result.error;

      if (isSignUp && !result.data.session) {
        statusBox.textContent = "Account created. Check your email for a confirmation link, then come back and log in.";
      } else {
        showSignedIn(result.data.user);
      }
    } catch (error) {
      statusBox.textContent = error.message || "Something went wrong. Please try again.";
    } finally {
      actionButton.disabled = false;
    }
  });

  function showSignedIn(user) {
    authArea.classList.add("hidden");
    userArea.classList.remove("hidden");
    const displayName = user?.user_metadata?.full_name || user?.email || "INSTASHIV user";
    document.getElementById("userMessage").textContent = "Signed in as " + displayName;
  }

  document.getElementById("logout").addEventListener("click", async () => {
    const { error } = await supabaseClient.auth.signOut();
    if (error) {
      alert(error.message);
      return;
    }
    userArea.classList.add("hidden");
    authArea.classList.remove("hidden");
    document.getElementById("authForm").reset();
    setMode(true);
  });

  async function checkExistingSession() {
    const { data, error } = await supabaseClient.auth.getSession();
    if (!error && data.session) showSignedIn(data.session.user);
  }

  setMode(true);
  checkExistingSession();
</script>
</body>
</html>
