
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSTASHIV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;color:#171717;font-family:Arial,sans-serif}
header{height:65px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-around;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}
.logo span{color:#e1306c}
button{cursor:pointer;border:0;background:none;font-size:20px}
.layout{max-width:950px;margin:25px auto;display:grid;grid-template-columns:1fr 280px;gap:35px;padding:0 12px}
.stories{display:flex;gap:15px;background:white;border:1px solid #ddd;border-radius:10px;padding:16px;overflow:auto;margin-bottom:20px}
.story{text-align:center;min-width:60px;font-size:12px}
.circle{width:58px;height:58px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#ffb000,#ed168c,#7639db);margin:auto auto 5px}
.circle img{width:100%;height:100%;border-radius:50%;border:3px solid white;object-fit:cover}
.post{background:white;border:1px solid #ddd;border-radius:10px;margin-bottom:22px;overflow:hidden}
.user{padding:13px;display:flex;align-items:center;gap:10px;font-weight:bold}
.avatar{width:35px;height:35px;border-radius:50%;object-fit:cover}
.postimg{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.actions{padding:12px 14px;display:flex;gap:15px}
.actions button{font-size:25px}
.caption{padding:0 14px 15px;font-size:14px}
.side{padding:15px;position:sticky;top:85px;height:max-content}
.side h3{font-size:16px}
.small{color:#777;font-size:13px}
.blue{color:#1683ed;font-weight:bold}
.create{background:#fff;border:1px solid #ddd;padding:15px;border-radius:10px;margin-bottom:20px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:7px 0}
.primary{background:#1683ed;color:white;padding:11px 18px;border-radius:8px;font-size:14px}
@media(max-width:700px){.layout{display:block;margin:12px auto}.side{display:none}header{justify-content:space-around}.stories{border-radius:0}.post{border-radius:0}}
</style>
</head>
<body>
<header>
<div class="logo">INSTA<span>SHIV</span></div>
<button onclick="location.reload()">⌂</button>
<button onclick="document.getElementById('photo').click()">＋</button>
<button onclick="alert('Welcome to INSTASHIV!')">♡</button>
<button onclick="alert('Your profile is coming soon!')">👤</button>
</header>

<div class="layout">
<main>
<div class="stories">
<div class="story"><div class="circle"><img src="https://i.pravatar.cc/100?img=12"></div>You</div>
<div class="story"><div class="circle"><img src="https://i.pravatar.cc/100?img=5"></div>Rahul</div>
<div class="story"><div class="circle"><img src="https://i.pravatar.cc/100?img=8"></div>Priya</div>
<div class="story"><div class="circle"><img src="https://i.pravatar.cc/100?img=15"></div>Arjun</div>
<div class="story"><div class="circle"><img src="https://i.pravatar.cc/100?img=20"></div>Neha</div>
</div>

<div class="create">
<b>Create a post ✨</b>
<input id="photo" type="file" accept="image/*">
<input id="captionInput" placeholder="Write a caption...">
<button class="primary" onclick="addPost()">Share Post</button>
</div>

<div id="feed">
<article class="post">
<div class="user"><img class="avatar" src="https://i.pravatar.cc/100?img=12"> Shaumy <span class="blue">●</span></div>
<img class="postimg" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900">
<div class="actions"><button onclick="like(this)">♡</button><button onclick="comment()">♧</button><button onclick="alert('Share INSTASHIV with friends!')">➤</button></div>
<div class="caption"><b>Shaumy</b> Welcome to INSTASHIV! ❤️<br><br><span class="small">Be yourself. Share your world.</span></div>
</article>
</div>
</main>

<aside class="side">
<h3>INSTASHIV</h3>
<p class="small">Welcome to your new social world.</p>
<hr>
<p><b>Shaumy</b></p>
<p class="small">Discover • Connect • Share</p>
<p class="blue">Explore your community →</p>
</aside>
</div>

<script>
function like(btn){
btn.textContent=btn.textContent==='♡'?'❤️':'♡';
}
function comment(){
let c=prompt('Write your comment:');
if(c)alert('Comment: '+c);
}
function addPost(){
let file=document.getElementById('photo').files[0];
let caption=document.getElementById('captionInput').value;
if(!file){alert('Please select a photo first!');return;}
let url=URL.createObjectURL(file);
let post=document.createElement('article');
post.className='post';
post.innerHTML='<div class="user">👤 Shaumy</div><img class="postimg"><div class="actions"><button onclick="like(this)">♡</button><button onclick="comment()">♧</button><button>➤</button></div><div class="caption"><b>Shaumy</b> '+caption.replace(/[&<>"]/g,'')+'</div>';
post.querySelector('img').src=url;
document.getElementById('feed').prepend(post);
document.getElementById('captionInput').value='';
document.getElementById('photo').value='';
}
</script>
</body>
</html>
